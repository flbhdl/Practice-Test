<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>我的航海梦</title>

    <!-- ============================================================
       下面这一段叫 CSS，管的是「长什么样」。
       今天不用你写，也看不懂没关系 —— 它只是让页面好看一点。
       你可以试着把整段删掉，看看页面会变成什么样。
       ============================================================ -->
    <style>
      body {
        font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 24px;
        color: #1a2230;
        background: #f7f9fc;
        line-height: 1.8;
      }
      h1 {
        color: #0e3f8c;
        font-size: 34px;
        margin-bottom: 6px;
      }
      h2 {
        color: #1e4fa8;
        font-size: 20px;
        margin: 28px 0 10px;
        border-left: 5px solid #3d7bd9;
        padding-left: 12px;
      }
      p {
        color: #4a5568;
        font-size: 16px;
      }
      img {
        width: 100%;
        border-radius: 10px;
        margin: 14px 0;
      }
      a {
        color: #0e3f8c;
      }
      footer {
        margin-top: 40px;
        padding-top: 16px;
        border-top: 1px solid #d6dce5;
        color: #8b97a8;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <!-- 一级标题：整页最重要的那句话，只写一个 -->
    <h1>我的航海梦</h1>

    <p>大家好，我是xxxxx 2026 级的新生。今天是我第一次写网页。</p>

    <h2>我为什么选这个专业</h2>
    <p>
      我家在长江边，从小看着货轮来来往往。后来才知道，现在的港口早就不是靠人喊口号在指挥了
      —— 码头上的岸桥、无人集卡、船期看板，背后全是一行行代码。
    </p>
    <p>我想成为那个写代码的人。</p>

    <!-- 图片：src 里的文件名必须和文件夹里的完全一致 -->
    <img src="../06-课堂实景图片/自动化码头.jpg" alt="自动化集装箱码头" />

    <h2>今天我学会了什么</h2>
    <p>
      我明白了：网页不是画出来的，是写出来的。它就是一份文本文档，
      浏览器把它一行一行「翻译」成你看到的样子。
    </p>
    <p>这是我做的第一个页面，我把它留在这里。</p>

    <h2>想了解更多</h2>
    <p><a href="https://www.jmi.edu.cn" target="_blank">去学校官网看看</a></p>

    <footer>H5· 开学第一课 &nbsp;|&nbsp;</footer>
  </body>
</html>
